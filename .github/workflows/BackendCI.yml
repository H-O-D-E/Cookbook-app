# This workflow builds and tests the .NET backend

name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/Cookbook-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore dependencies
        run: dotnet restore Cookbook-app.sln

      - name: Run unit tests
        run: >
          dotnet test
          Cookbook-App-Tests/Cookbook-App-Tests.csproj
          --configuration Release
          --no-restore
          --filter "FullyQualifiedName!~CookBook.Tests.CookBookIntegrationTests"
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory TestResults

      - name: Upload unit-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: backend/Cookbook-app/TestResults
          if-no-files-found: warn

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: unit-tests

    defaults:
      run:
        working-directory: backend/Cookbook-app

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore dependencies
        run: dotnet restore Cookbook-app.sln

      - name: Run integration tests
        run: >
          dotnet test
          Cookbook-App-Tests/Cookbook-App-Tests.csproj
          --configuration Release
          --no-restore
          --filter "FullyQualifiedName~CookBook.Tests.CookBookIntegrationTests"
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory TestResults/Integration

      - name: Upload integration-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: backend/Cookbook-app/TestResults/Integration
          if-no-files-found: warn
