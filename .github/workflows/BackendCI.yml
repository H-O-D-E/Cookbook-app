# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-netname: Backend CI
  name : Backend CI 
  on:
    pull_request:
      branches: [main]
    push:
      branches: [main]

  permissions:
    contents: read

  jobs:
    unit-tests:
      name: Unit tests
      runs-on: ubuntu-latest 
      
      defaults:
        run:
          working-directory: backend/Cookbook-app

      steps:
        - name: Check out repository
          uses: actions/checkout@v5

        - name: Install .NET 8
          uses: actions/setup-dotnet@v5
          with:
            dotnet-version: 8.0.x
            cache: true
            cache-dependency-path: "**/*.csproj"

        - name: Restore dependencies
          run: dotnet restore Cookbook-app.sln

        - name: Run unit tests
          run: >
            dotnet test
            Cookbook-App.UnitTests/Cookbook-App.UnitTests.csproj
            --configuration Release
            --no-restore
            --logger "trx;LogFileName=unit-tests.trx"
            --results-directory TestResults

        - name: Upload unit-test results
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: unit-test-results
            path: TestResults
            if-no-files-found: warn
